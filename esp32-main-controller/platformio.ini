[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

lib_deps = 
    bodmer/TFT_eSPI@^2.5.43
    witnessmenow/UniversalTelegramBot


monitor_speed = 115200
upload_speed = 115200

build_flags = 
    -DUSER_SETUP_LOADED=1
    -DILI9488_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480

    -DTFT_MOSI=23
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=4
    -DTFT_SCLK=18

    -DTOUCH_CS=21
    -DTOUCH_MISO=19     ; DO
    -DTOUCH_MOSI=23     ; DIN
    -DTOUCH_SCLK=18     ; CLK

    -DSUPPORT_TOUCH_CONTROLLER_XPT2046=1
    -DSPI_TOUCH_FREQUENCY=2500000     

    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DSPI_FREQUENCY=27000000